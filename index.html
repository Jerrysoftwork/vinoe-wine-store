<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="VINOÉ — Discover carefully selected fine wines for exceptional moments."
    >

    <title>VINOÉ | Fine Wines. Exceptional Moments.</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==============================
         HEADER
         ============================== -->

    <header class="header">

        <div class="container nav-container">

            <!-- LOGO -->
            <a href="#" class="logo" aria-label="VINOÉ Home">
                <span>VINOÉ</span>
                <small>Fine Wines</small>
            </a>


            <!-- NAVIGATION -->
            <nav class="nav" aria-label="Main navigation">

                <a href="#" class="nav-link active">Home</a>

                <a href="#" class="nav-link">Shop</a>

                <a href="#" class="nav-link">Collections</a>

                <a href="#" class="nav-link">About</a>

                <a href="#" class="nav-link">Contact</a>

            </nav>


            <!-- NAVIGATION ACTIONS -->
            <div class="nav-actions">

                <!-- Search -->
                <button
                    class="nav-icon"
                    type="button"
                    aria-label="Search"
                >
                    ⌕
                </button>


                <!-- Cart -->
                <button
                    class="nav-icon cart"
                    type="button"
                    aria-label="Shopping cart"
                >
                    ♡

                    <span class="cart-count">
                        0
                    </span>
                </button>

            </div>

        </div>

    </header>



    <!-- ==============================
         MAIN CONTENT
         ============================== -->

    <main>

        <!-- ==============================
             HERO SECTION
             ============================== -->

        <section class="hero">

            <div class="container hero-container">


                <!-- HERO CONTENT -->

                <div class="hero-content">

                    <p class="hero-eyebrow">
                        DISCOVER THE ART OF WINE
                    </p>


                    <h1>
                        Fine Wines.<br>
                        <span>Exceptional Moments.</span>
                    </h1>


                    <p class="hero-description">
                        Carefully selected wines crafted to elevate
                        the moments that matter most.
                    </p>


                    <!-- HERO BUTTONS -->

                    <div class="hero-buttons">

                        <a
                            href="#"
                            class="btn btn-primary"
                        >
                            Explore Collection
                        </a>


                        <a
                            href="#"
                            class="btn btn-secondary"
                        >
                            Our Story
                        </a>

                    </div>

                </div>



                <!-- HERO IMAGE -->

                <div class="hero-image">

                    <div class="image-frame">

                        <img
                            src="https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?auto=format&fit=crop&w=900&q=85"
                            alt="Premium red wine bottle and wine glass"
                        >

                    </div>


                    <!-- CURATED SELECTION BADGE -->

                    <div class="hero-badge">

                        <span>V</span>

                        <p>
                            Curated<br>
                            Selection
                        </p>

                    </div>

                </div>

            </div>

        </section>

    </main>



    <!-- ==============================
         FOOTER
         ============================== -->

    <footer>

        <!-- Footer will be built later -->

    </footer>


</body>

</html>
